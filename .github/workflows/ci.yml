name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require a changeset on pull requests
        if: github.event_name == 'pull_request'
        run: pnpm changeset status --since=origin/main
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm examples:typecheck
      - run: pnpm demo:build
      - name: Install LibreOffice and poppler (render checks)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-calc poppler-utils
      - name: Install the fonts the visual baselines were rendered with
        run: sudo apt-get install -y --no-install-recommends fonts-inter fonts-crosextra-carlito fonts-liberation fonts-dejavu-core
      - name: Unit and integration tests with coverage thresholds
        run: pnpm coverage
        env:
          REQUIRE_RENDER: '1'
      - name: Visual regression of LibreOffice renders (tests/baselines/render)
        run: pnpm test:visual --reporter=verbose
        env:
          REQUIRE_RENDER: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diff-node${{ matrix.node }}
          path: tests/output/visual/**
          if-no-files-found: ignore
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Pack and smoke-install the package
        run: pnpm pack-check --no-build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artifacts-node${{ matrix.node }}
          path: |
            tests/output/**/*.xlsx
            tests/output/render/**
            e2e/output/**
          if-no-files-found: ignore

  openxml-validate:
    # Open XML SDK (DocumentFormat.OpenXml) validation of the generated workbooks: the closest
    # automated check to Microsoft Excel's own parser. Still not Excel; see docs/manual-qa.md.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: pnpm install --frozen-lockfile
      - name: Generate workbooks (export fixtures v13 + writer fixtures)
        run: pnpm exec vitest run tests/integration/export-fixtures.v13.test.ts tests/integration/writer-render.test.ts
      - name: Validate with the Open XML SDK (Office 2016)
        run: dotnet run --project tools/ooxml-validator -- tests/output/export/v13/*.xlsx tests/output/writer/*.xlsx examples/workbooks/*.xlsx
